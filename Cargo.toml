[package]
name = "rain"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust Automated Issue eNgine — turns GitHub issues into reviewed pull requests using Claude Code"
license = "GPL-3.0-or-later"
repository = "https://github.com/harrydayexe/rain"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
strip = true
